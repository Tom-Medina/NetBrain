name: Publish ARM32

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish linux-arm
        run: dotnet publish NetBrain/NetBrain.csproj -c Release -r linux-arm --self-contained false -o ./publish

      - name: Create zip
        run: cd publish && zip -r ../netbrain-linux-arm.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netbrain-linux-arm
          path: ./publish/

      - name: Create rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: Auto-published from ${{ github.sha }}
          files: netbrain-linux-arm.zip
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
